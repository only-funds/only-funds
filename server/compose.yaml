services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
      TRUST_PROXY: '1'
    volumes:
      - lab-data:/data
    ports:
      - '127.0.0.1:8787:8787'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8787/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [https]
    env_file: .env
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  lab-data:
  caddy-data:
  caddy-config:
